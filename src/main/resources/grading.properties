# ScholarBase academic rules - edit here, rebuild, redeploy. No grading values are hardcoded in Java.

# Minimum percentage in a course to pass it
pass.percentage=40

# Default "maximum marks" pre-filled in the marks entry form
default.max.marks=100

# Minimum attendance percentage expected from every student
attendance.minimum=75

# Grade scale, highest first. Format: GRADE:minimum-percentage:grade-points
grade.scale=O:90:10,A+:80:9,A:70:8,B+:60:7,B:50:6,C:40:5,F:0:0
